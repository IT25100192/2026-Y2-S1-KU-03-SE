spring:
  datasource:
    url: jdbc:h2:mem:starvoice-test;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  thymeleaf:
    cache: false

starvoice:
  free-votes-per-round: 5
  vote-price-lkr: 25
  notify-provider: console
