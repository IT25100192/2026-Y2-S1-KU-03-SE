<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' - StarVoice Lanka'">StarVoice Lanka</title>
  <link rel="stylesheet" th:href="@{/assets/style.css}">
</head>
<body>

<header class="topbar" th:fragment="topbar">
  <div class="wrap">
    <a class="brand" th:href="@{/}"><span class="dot"></span>StarVoice <span>Lanka</span></a>

    <nav class="nav">
      <a th:href="@{/}">Home</a>
      <a th:href="@{/contestants}">Contestants</a>
      <a th:href="@{/results}">Results</a>
      <a th:href="@{/bundles}">Vote credits</a>
      <a th:href="@{/partners}">Partners</a>
      <th:block th:if="${currentUser != null}">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:if="${isAdmin}" th:href="@{/admin/rounds}">Show control</a>
        <a th:if="${!isAdmin and isSponsorDesk}" th:href="@{/admin/agreements}">Sponsor desk</a>
      </th:block>
    </nav>

    <div class="usermenu">
      <th:block th:if="${currentUser != null}">
        <a class="btn btn-ghost btn-sm" th:href="@{/my/wallet}" style="color:var(--gold);font-weight:600;display:inline-flex;align-items:center;gap:4px" title="Manage wallet and buy credits">
          <span>⚡</span>
          <span>Buy Credits</span>
        </a>
        <a class="who" th:href="@{/profile}">
          <b th:text="${currentUser.fullName}">User</b>
          <span th:text="${helpers.titleCase(currentUser.role.name())}">Voter</span>
        </a>
        <form method="post" th:action="@{/logout}" style="margin:0">
          <button class="btn btn-ghost btn-sm" type="submit">Sign out</button>
        </form>
      </th:block>
      <th:block th:if="${currentUser == null}">
        <a class="btn btn-ghost btn-sm" th:href="@{/login}">Sign in</a>
        <a class="btn btn-primary btn-sm" th:href="@{/register}">Create account</a>
      </th:block>
    </div>
  </div>
</header>

<div th:fragment="alerts">
  <div th:if="${ok != null}" class="alert ok" th:text="${ok}"></div>
  <div th:if="${error != null}" class="alert error" th:text="${error}"></div>
  <div th:if="${info != null}" class="alert info" th:text="${info}"></div>
  <div th:if="${warn != null}" class="alert warn" th:text="${warn}"></div>
  <div th:if="${message != null}" class="alert ok" th:text="${message}"></div>
</div>

</body>
</html>
