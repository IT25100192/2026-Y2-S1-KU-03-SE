<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head(${title != null ? title : 'Error'})}"></head>
<body>
<header th:replace="~{layout/head :: topbar}"></header>

<main>
  <div class="wrap">
    <div class="card center" style="max-width:560px;margin:60px auto">
      <h1 style="font-size:3rem;color:var(--gold)" th:text="${status != null ? status : 500}">500</h1>
      <h2 th:text="${title != null ? title : 'Something went wrong'}">Error</h2>
      <p class="muted" th:text="${message != null ? message : 'An unexpected error occurred.'}">Message</p>
      <div class="btn-row" style="justify-content:center">
        <a class="btn btn-primary" th:href="@{/}">Back to the show</a>
      </div>
    </div>
  </div>
</main>

<footer th:replace="~{layout/foot :: foot}"></footer>
</body>
</html>
