<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('Contestants')}"></head>
<body>
<header th:replace="~{layout/head :: topbar}"></header>

<main>
  <div class="wrap">
    <div th:replace="~{layout/head :: alerts}"></div>

    <div class="page-head">
      <div>
        <h1>Contestants</h1>
        <p class="sub">
          <span th:text="${season != null ? season.name : 'This season'}">Season</span> &middot;
          <span th:text="${#lists.size(contestants)} + ' registered'">10 registered</span>
        </p>
      </div>
    </div>

    <div th:if="${#lists.isEmpty(contestants)}" class="card empty">
      <h3>Nobody is registered yet</h3>
      <p>The line-up goes up once auditions close.</p>
    </div>

    <div th:if="${not #lists.isEmpty(contestants)}" class="grid three">
      <div th:each="c : ${contestants}" class="card singer">
        <img th:if="${c.photoUrl != null and !c.photoUrl.isEmpty()}" class="photo" th:src="${c.photoUrl}" th:alt="${c.displayName}">
        <div th:if="${c.photoUrl == null or c.photoUrl.isEmpty()}" class="photo" th:text="${c.displayName.substring(0, 1)}">A</div>

        <h3 th:text="${c.displayName}">Stage Name</h3>
        <p class="faint">
          <span th:text="${c.district != null ? c.district : 'Sri Lanka'}">Sri Lanka</span>
          <span th:if="${c.age != null}" th:text="' &middot; ' + ${c.age}"> &middot; 24</span>
        </p>
        <span class="badge" th:classappend="${helpers.tone(c.status.name())}" th:text="${helpers.titleCase(c.status.name())}">Active</span>
        <div class="kv" style="margin-top:14px"><span>Votes so far</span><b th:text="${helpers.number(c.totalVotes)}">0</b></div>
        <a class="btn btn-ghost btn-sm" style="margin-top:12px" th:href="@{'/contestants/' + ${c.id}}">Profile</a>
      </div>
    </div>
  </div>
</main>

<footer th:replace="~{layout/foot :: foot}"></footer>
</body>
</html>
