<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('Results')}"></head>
<body>
<header th:replace="~{layout/head :: topbar}"></header>

<main>
  <div class="wrap">
    <div th:replace="~{layout/head :: alerts}"></div>

    <div class="page-head">
      <div>
        <h1>Rounds and results</h1>
        <p class="sub">Every round this season, newest first.</p>
      </div>
    </div>

    <div th:if="${#lists.isEmpty(rounds)}" class="card empty">
      <h3>No rounds yet</h3>
      <p>The schedule goes up once the season opens.</p>
    </div>

    <div th:if="${not #lists.isEmpty(rounds)}" class="grid two">
      <div th:each="r : ${rounds}" class="card">
        <div class="split">
          <h2 th:text="${r.name}">Round Name</h2>
          <span class="badge" th:classappend="${helpers.tone(r.status.name())}" th:text="${helpers.titleCase(r.status.name())}">Status</span>
        </div>
        <p class="faint">
          <span th:text="'Round ' + ${r.sequence}">Round 1</span>
          <span th:if="${r.closesAt != null}" th:text="' &middot; closes ' + ${helpers.dateTime(r.closesAt)}"> &middot; closes date</span>
        </p>
        <div class="btn-row" style="margin-top:12px">
          <a class="btn btn-ghost btn-sm" th:href="@{'/results/' + ${r.id}}">Standings</a>
          <a th:if="${r.status.name() == 'OPEN'}" class="btn btn-live btn-sm" th:href="@{'/vote/' + ${r.id}}">Vote</a>
        </div>
      </div>
    </div>
  </div>
</main>

<footer th:replace="~{layout/foot :: foot}"></footer>
</body>
</html>
