<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head(${contestant.displayName})}"></head>
<body>
<header th:replace="~{layout/head :: topbar}"></header>

<main>
  <div class="wrap">
    <div th:replace="~{layout/head :: alerts}"></div>

    <div class="grid two">
      <div class="card singer">
        <img th:if="${contestant.photoUrl != null and !contestant.photoUrl.isEmpty()}" class="photo" th:src="${contestant.photoUrl}" th:alt="${contestant.displayName}">
        <div th:if="${contestant.photoUrl == null or contestant.photoUrl.isEmpty()}" class="photo" th:text="${contestant.displayName.substring(0, 1)}">A</div>

        <h1 style="font-size:1.6rem" th:text="${contestant.displayName}">Stage Name</h1>
        <p class="muted" th:text="${contestant.fullName}">Full Name</p>
        <span class="badge" th:classappend="${helpers.tone(contestant.status.name())}" th:text="${helpers.titleCase(contestant.status.name())}">Active</span>

        <div style="margin-top:18px;text-align:left">
          <div class="kv"><span>District</span><b th:text="${contestant.district != null ? contestant.district : '-'}">-</b></div>
          <div class="kv"><span>Age</span><b th:text="${contestant.age != null ? contestant.age : '-'}">-</b></div>
          <div class="kv"><span>Season</span><b th:text="${contestant.season != null ? contestant.season.name : '-'}">-</b></div>
          <div class="kv"><span>Total votes</span><b th:text="${helpers.number(contestant.totalVotes)}">0</b></div>
        </div>

        <p th:if="${contestant.bio != null and !contestant.bio.isEmpty()}" class="muted" style="margin-top:16px;text-align:left" th:text="${contestant.bio}">Bio</p>
      </div>

      <div class="card">
        <h2>Round by round</h2>
        <div th:if="${#lists.isEmpty(entries)}" class="empty">
          <p class="muted">Not assigned to a round yet.</p>
        </div>
        <div th:if="${not #lists.isEmpty(entries)}" class="table-wrap">
          <table>
            <thead>
              <tr><th>Round</th><th>Performance</th><th class="right">Votes</th><th>Outcome</th></tr>
            </thead>
            <tbody>
              <tr th:each="item : ${entries}">
                <td th:text="${item.round != null ? item.round.name : '-'}">Round 1</td>
                <td>
                  <span th:text="${item.entry.performanceTitle != null ? item.entry.performanceTitle : '-'}">Song</span>
                  <th:block th:if="${item.entry.mediaUrl != null and !item.entry.mediaUrl.isEmpty()}">
                    <br><a class="faint" th:href="${item.entry.mediaUrl}" target="_blank" rel="noopener">Watch the clip</a>
                  </th:block>
                </td>
                <td class="right"><b th:text="${helpers.number(item.entry.votesInRound)}">0</b></td>
                <td>
                  <span class="badge" th:classappend="${helpers.tone(item.entry.outcome.name())}" th:text="${helpers.titleCase(item.entry.outcome.name())}">Outcome</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>

<footer th:replace="~{layout/foot :: foot}"></footer>
</body>
</html>
