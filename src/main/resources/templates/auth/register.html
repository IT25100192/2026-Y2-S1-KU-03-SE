<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('Create account')}"></head>
<body>
<header th:replace="~{layout/head :: topbar}"></header>

<main>
  <div class="wrap">
    <div th:replace="~{layout/head :: alerts}"></div>

    <div class="card auth-card">
      <h1 style="font-size:1.5rem">Create your account</h1>
      <p class="muted">You need a verified account to vote. Verification is a 6-digit code.</p>

      <form method="post" th:action="@{/register}">
        <div class="field">
          <label for="fullName">Full name</label>
          <input id="fullName" name="fullName" th:value="${form != null ? form.fullName : ''}" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" th:value="${form != null ? form.email : ''}" required>
        </div>
        <div class="field">
          <label for="mobile">Mobile</label>
          <input id="mobile" name="mobile" th:value="${form != null ? form.mobile : ''}" placeholder="0771234567" required>
          <div class="hint">Sri Lankan mobile number - 07XXXXXXXX or +947XXXXXXXX.</div>
        </div>
        <div class="field">
          <label for="nic">NIC <span class="faint">(optional)</span></label>
          <input id="nic" name="nic" th:value="${form != null ? form.nic : ''}">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" minlength="8" required>
          <div class="hint">At least 8 characters.</div>
        </div>
        <button class="btn btn-primary" style="width:100%" type="submit">Create account</button>
      </form>

      <p class="faint" style="margin-top:16px">Already have one? <a th:href="@{/login}">Sign in</a>.</p>
    </div>
  </div>
</main>

<footer th:replace="~{layout/foot :: foot}"></footer>
</body>
</html>
