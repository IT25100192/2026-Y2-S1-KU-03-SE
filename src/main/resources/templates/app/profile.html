<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('Profile')}"></head>
<body>
<header th:replace="~{layout/head :: topbar}"></header>

<main>
  <div class="wrap">
    <div th:replace="~{layout/head :: alerts}"></div>

    <div class="page-head">
      <div>
        <h1>Profile</h1>
        <p class="sub">
          <span class="badge" th:classappend="${helpers.tone(user.status.name())}" th:text="${helpers.titleCase(user.status.name())}">Active</span>
          <span th:text="${helpers.titleCase(user.role.name())} + ' account'">Voter account</span> &middot;
          joined <span th:text="${helpers.date(user.createdAt)}">date</span>
        </p>
      </div>
    </div>

    <div class="grid two">
      <div class="card">
        <h2>Your details</h2>
        <form method="post" th:action="@{/profile}">
          <div class="field">
            <label for="fullName">Full name</label>
            <input id="fullName" name="fullName" th:value="${user.fullName}" required>
          </div>
          <div class="field">
            <label>Email</label>
            <input th:value="${user.email}" disabled>
            <div class="hint">Email cannot be changed from here.</div>
          </div>
          <div class="field">
            <label for="mobile">Mobile</label>
            <input id="mobile" name="mobile" th:value="${user.mobile}" required>
          </div>
          <div class="field">
            <label for="nic">NIC</label>
            <input id="nic" name="nic" th:value="${user.nic != null ? user.nic : ''}">
          </div>
          <button class="btn btn-primary" style="width:100%" type="submit">Save changes</button>
        </form>
      </div>

      <div>
        <div class="card">
          <h2>Change password</h2>
          <form method="post" th:action="@{/profile/password}">
            <div class="field">
              <label for="currentPassword">Current password</label>
              <input id="currentPassword" name="currentPassword" type="password" required>
            </div>
            <div class="field">
              <label for="newPassword">New password</label>
              <input id="newPassword" name="newPassword" type="password" minlength="8" required>
            </div>
            <button class="btn btn-primary" style="width:100%" type="submit">Change password</button>
          </form>
        </div>

        <div class="card">
          <h2>Close account</h2>
          <p class="muted">Your account is anonymised, not deleted, and this cannot be undone from here.</p>
          <form method="post" th:action="@{/profile/close}" onsubmit="return confirm('Close your account? This cannot be undone.');">
            <div class="field">
              <label for="confirmPassword">Confirm your password</label>
              <input id="confirmPassword" name="confirmPassword" type="password" required>
            </div>
            <button class="btn btn-danger" style="width:100%" type="submit">Close my account</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

<footer th:replace="~{layout/foot :: foot}"></footer>
</body>
</html>
