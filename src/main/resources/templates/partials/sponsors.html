<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="sponsors(sponsors)">
  <div th:if="${sponsors != null and not #lists.isEmpty(sponsors)}" class="card tight">
    <div class="split" style="margin-bottom:10px">
      <span class="faint">Brought to you by</span>
      <a class="faint" th:href="@{/partners}">Partner with the show</a>
    </div>
    <div class="sponsors">
      <a th:each="s : ${sponsors}" class="sponsor-chip" th:href="@{'/sponsor-click/' + ${s.agreementId}}" target="_blank" rel="noopener">
        <span class="badge tier" th:text="${s.tier}">TITLE</span>
        <span th:text="${s.sponsorName}">Sponsor</span>
      </a>
    </div>
  </div>
</div>

</body>
</html>
