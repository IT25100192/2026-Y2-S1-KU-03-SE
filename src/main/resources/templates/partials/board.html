<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="board(standings, voteLinkRound)">
  <div th:if="${standings == null or #lists.isEmpty(standings)}" class="empty">
    <p class="muted">No votes in this round yet.</p>
  </div>
  <div th:if="${standings != null and not #lists.isEmpty(standings)}" class="board">
    <div th:each="s : ${standings}" class="row" th:classappend="${s.rank == 1 and s.votes > 0 ? 'top' : ''}">
      <span class="fill" th:style="'width: ' + ${T(java.lang.Math).max(2.0, s.share)} + '%'"></span>
      <div class="rank" th:text="${s.rank}">1</div>
      <div class="who">
        <b th:text="${s.name}">Name</b>
        <small>
          <span th:text="${s.district != null ? s.district : 'Sri Lanka'}">District</span>
          <th:block th:if="${s.outcome != null and s.outcome != 'PENDING'}">
            &middot; <span class="badge" th:classappend="${helpers.tone(s.outcome)}" th:text="${helpers.titleCase(s.outcome)}">Outcome</span>
          </th:block>
        </small>
      </div>
      <div class="votes">
        <b th:text="${helpers.number(s.votes)}">0</b>
        <small th:text="${s.share} + '%'">0%</small>
      </div>
      <a th:if="${voteLinkRound != null}" class="btn btn-live btn-sm" th:href="@{'/vote/' + ${voteLinkRound} + '?contestant=' + ${s.contestantId}}">Vote</a>
    </div>
  </div>
</div>

</body>
</html>
