<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('Edit contestant - Admin')}"></head>
<body>
<header th:replace="~{layout/head :: topbar}"></header>

<main>
  <div class="wrap">
    <div th:replace="~{layout/head :: alerts}"></div>

    <div class="page-head">
      <div>
        <h1>Edit contestant</h1>
        <p class="sub">Update this performer's details.</p>
      </div>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:24px;border-bottom:1px solid var(--line);padding-bottom:12px;flex-wrap:wrap;align-items:center">
      <a class="btn btn-sm btn-ghost" th:href="@{/admin/rounds}">Rounds</a>
      <a class="btn btn-sm btn-ghost" th:href="@{/admin/seasons}">Seasons</a>
      <a class="btn btn-sm btn-ghost" th:href="@{/admin/contestants}">Contestants</a>
      <a class="btn btn-sm btn-ghost" th:href="@{/admin/users}">Users</a>
      <a class="btn btn-sm btn-ghost" th:href="@{/admin/audit}">Audit Log</a>
      <a class="btn btn-sm btn-ghost" th:href="@{/admin/agreements}">Sponsors</a>
      <a class="btn btn-sm btn-ghost" th:href="@{/admin/payments}">Payments</a>
      <a class="btn btn-sm btn-ghost" th:href="@{/admin/bundles}">Bundles</a>
      <a class="btn btn-sm btn-ghost" th:href="@{/admin/votes}">Votes</a>
      <a class="btn btn-sm btn-ghost" th:href="@{/admin/notifications}">Notifications</a>
    </div>
    <div class="card" style="max-width:640px">
      <form method="post" th:action="@{'/admin/contestants/' + ${contestant.id} + '/edit'}">
        <div class="field"><label>Full legal name</label>
          <input type="text" name="fullName" th:value="${contestant.fullName}" required maxlength="120" /></div>
        <div class="field"><label>Stage / display name</label>
          <input type="text" name="stageName" th:value="${contestant.stageName}" maxlength="120" /></div>
        <div class="field"><label>Age</label>
          <input type="number" name="age" th:value="${contestant.age}" min="16" max="99" /></div>
        <div class="field"><label>District</label>
          <input type="text" name="district" th:value="${contestant.district}" required maxlength="80" /></div>
        <div class="field"><label>Bio</label>
          <textarea name="bio" rows="4" maxlength="1000" th:text="${contestant.bio}"></textarea></div>
        <div style="display:flex;gap:10px;margin-top:14px">
          <button class="btn btn-primary" type="submit">Save changes</button>
          <a class="btn btn-ghost" th:href="@{/admin/contestants}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</main>

<footer th:replace="~{layout/foot :: foot}"></footer>
</body>
</html>
